<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Cat ears -->
  <polygon points="6,18 11,6 16,18" fill="#8b5cf6"/>
  <polygon points="24,18 29,6 34,18" fill="#8b5cf6"/>
  <!-- Cat head -->
  <ellipse cx="20" cy="24" rx="14" ry="13" fill="#8b5cf6"/>
  <!-- Eyes -->
  <ellipse cx="15" cy="22" rx="2.2" ry="2.5" fill="white"/>
  <ellipse cx="25" cy="22" rx="2.2" ry="2.5" fill="white"/>
  <ellipse cx="15.4" cy="22.2" rx="1.2" ry="1.6" fill="#1e1b4b"/>
  <ellipse cx="25.4" cy="22.2" rx="1.2" ry="1.6" fill="#1e1b4b"/>
  <!-- Nose -->
  <polygon points="20,26.5 18.5,25 21.5,25" fill="#ec4899"/>
  <!-- Mouth -->
  <path d="M18.5 27 Q20 28.5 21.5 27" stroke="#ec4899" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <!-- Whiskers left -->
  <line x1="7" y1="25" x2="14" y2="26" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
  <line x1="7" y1="27.5" x2="14" y2="27.5" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
  <!-- Whiskers right -->
  <line x1="26" y1="26" x2="33" y2="25" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
  <line x1="26" y1="27.5" x2="33" y2="27.5" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
</svg>
